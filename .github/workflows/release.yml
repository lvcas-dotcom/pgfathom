name: Release

on:
  push:
    tags: ["v*"]

# Publishing is irreversible: a deleted tag survives in the cache of whoever
# already downloaded it, and a version republished with different content is the
# fastest way to destroy trust in an infrastructure tool. So the suite runs
# before goreleaser touches anything, in the same job, and a failure aborts
# without publishing.
permissions:
  contents: write
  packages: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser reads the history to resolve the version and commit
          # that go into the binary, and a shallow clone would leave it half
          # informed without saying so.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The integration suite stays out: it needs Docker inside the runner and
      # takes minutes, and what it protects was already protected by the merge
      # that produced the commit being released.
      - run: go test ./...
      - run: make lint
      - run: make crosscheck

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Writing to the tap goes through a deploy key, scoped to one repository.
      # The key is written to a file because goreleaser expects a path, not the
      # contents. Without the secret the variable stays empty and the Homebrew
      # channel is skipped — the variable is always defined so the template
      # never evaluates a key that does not exist. See docs/RELEASING.md.
      - name: tap key
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "HOMEBREW_TAP_KEY_PATH=" >> "$GITHUB_ENV"
            echo "::notice::no tap deploy key: this release goes out without the Homebrew channel"
            exit 0
          fi
          path="$RUNNER_TEMP/homebrew_tap_key"
          install -m 600 /dev/null "$path"
          printf '%s\n' "$KEY" > "$path"
          echo "HOMEBREW_TAP_KEY_PATH=$path" >> "$GITHUB_ENV"

      # Release notes are written by hand in the CHANGELOG and extracted here.
      # If the version has no section, this fails before goreleaser publishes
      # anything — publishing is irreversible, and empty notes cannot be fixed.
      - name: release notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          scripts/release-notes.sh "${{ github.ref_name }}" > "$notes"
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes "${{ env.RELEASE_NOTES }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The version comes from the ref that triggered the workflow, not
          # from `git describe`. When a candidate and the final version mark the
          # same commit — the normal case, if the candidate passed and nothing
          # changed after it — describe picks between the two tags and can pick
          # the wrong one: the v0.1.0 release tried to publish itself as
          # v0.1.0-rc.2 and died on an asset that already existed.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
