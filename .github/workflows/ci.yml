name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  # O README promete que quem aprova rodar isto contra produção abre o go.mod
  # primeiro. Um go.mod fora de tidy engana exatamente esse leitor: o driver
  # aparece como dependência indireta, como se ninguém aqui o tivesse escolhido.
  tidy:
    name: go.mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: go mod tidy não deixa diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Suíte unitária: sem Docker, sem rede, em todas as plataformas alvo.
  # Quem quiser contribuir um perfil de nomenclatura precisa passar só por aqui.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go build ./...
      - run: go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      # Instalado direto em vez de via action: o .golangci.yml usa o schema v2,
      # e a action da linha v1 não o entende. Instalando aqui, a versão fica
      # fixada na mesma que roda localmente, então "passa no meu" e "passa no
      # CI" querem dizer a mesma coisa.
      - name: instala golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make lint

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go test -coverprofile=coverage.out ./...
      - name: cobertura de internal/profile
        run: go tool cover -func=coverage.out | grep -E 'internal/profile|^total'

  # Sobe PostgreSQL real via testcontainers. Precisa de Docker, então roda só em
  # Linux e separado do job rápido — quem contribui um perfil de nomenclatura
  # não deveria depender deste job para ter retorno.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: make test-integration

  # Prova que o binário atravessa as plataformas sem cgo.
  crosscheck:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: make crosscheck
