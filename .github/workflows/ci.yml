name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  # The README promises that whoever approves running this against production
  # opens go.mod first. An untidy go.mod misleads exactly that reader: the
  # driver shows up as an indirect dependency, as if nobody here had chosen it.
  tidy:
    name: go.mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The unit suite: no Docker, no network, on every target platform. Anyone
  # contributing a naming profile only has to get past this one.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go build ./...
      - run: go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      # Installed directly rather than through the action: .golangci.yml uses
      # the v2 schema, and the v1-line action does not understand it. Installing
      # it here pins the same version that runs locally, so "passes on mine" and
      # "passes in CI" mean the same thing.
      - name: install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make lint

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go test -coverprofile=coverage.out ./...
      - name: coverage of internal/profile
        run: go tool cover -func=coverage.out | grep -E 'internal/profile|^total'

  # Starts real PostgreSQL through testcontainers. It needs Docker, so it runs
  # on Linux only and apart from the fast job — somebody contributing a naming
  # profile should not have to wait on this one for an answer.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: make test-integration

  # The version stamp lives in two configurations that have to agree — the
  # Makefile and .goreleaser.yaml. When they drift, the published binary answers
  # a pseudo-version of the commit instead of the tag, and the JSON goes out
  # with the wrong tool_version. None of that fails a unit test, so it fails
  # here.
  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true
      - run: make release-check

  # The image is the other thing that only fails in the hands of whoever
  # publishes. The Dockerfile depends on the shape of the context goreleaser
  # assembles, and writing for the wrong shape passes the entire suite and
  # breaks during the release.
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: make image-check

  # Proves the binary crosses every platform without cgo.
  crosscheck:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: make crosscheck
