version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - misspell
    - bodyclose
    - errorlint
    - gocritic

  settings:
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-return
        - name: context-as-argument
        - name: indent-error-flow

  exclusions:
    rules:
      # A table of test cases is declarative and long by nature.
      - path: _test\.go
        linters:
          - gocritic

      # The fixtures are table and column names in Portuguese and Spanish —
      # `clientes`, `responsaveis`, `opcoes`. An English spell checker reads
      # those as typos, and that vocabulary is exactly what this tool exists to
      # understand.
      - path: _test\.go
        linters:
          - misspell

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lvcas-dotcom/pgfathom
