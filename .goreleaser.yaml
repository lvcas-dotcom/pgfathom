version: 2

# CGO_ENABLED=0 não é otimização, é requisito, e é o que torna estas quatro
# plataformas baratas. `make crosscheck` prova a mesma coisa a cada mudança.

project_name: pgfathom

before:
  hooks:
    - go mod tidy
    # O autocompletar é gerado do comando, nunca escrito à mão: o discover tem
    # vinte e uma flags, e um arquivo mantido à mão divergiria no primeiro
    # release que acrescentasse uma delas — sem que a divergência tivesse como
    # ser notada. `go run` porque este hook roda antes de existir binário.
    - sh -c 'mkdir -p completions && for sh in bash zsh fish; do go run ./cmd/pgfathom completion "$sh" > "completions/pgfathom.$sh"; done'

builds:
  - id: pgfathom
    main: ./cmd/pgfathom
    binary: pgfathom
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Os três nomes abaixo têm que ser os mesmos que o Makefile injeta. São duas
    # configurações concordando sobre três variáveis, que é o tipo de acordo que
    # se rompe quando alguém renomeia uma delas — daí o job de CI que constrói
    # por aqui e pergunta a versão ao binário.
    ldflags:
      - -s -w
      - -X github.com/lvcas-dotcom/pgfathom/internal/buildinfo.Version={{ .Version }}
      - -X github.com/lvcas-dotcom/pgfathom/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/lvcas-dotcom/pgfathom/internal/buildinfo.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: pgfathom
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - src: completions/*
        dst: completions

# Quem autoriza rodar isto contra produção confere o que baixou.
checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore: arquiva"
      - "^docs:"
      - "^test:"

# Pacote de distribuição é o caminho mais curto do usuário-alvo: DBA em servidor
# Linux, sem Go, sem Homebrew. Os caminhos abaixo não são escolha nossa, e é isso
# que os torna certos — quem instala um pacote espera encontrar as coisas onde o
# sistema as guarda. Sem repositório apt ou yum: ver docs/RELEASING.md.
nfpms:
  - id: pgfathom
    package_name: pgfathom
    formats: [deb, rpm]
    maintainer: lvcas-dotcom <https://github.com/lvcas-dotcom>
    homepage: https://github.com/lvcas-dotcom/pgfathom
    license: Apache-2.0
    description: |-
      Discovers and validates PostgreSQL relationships that exist in the data
      but were never declared.
      Strictly read-only: it never issues a statement that modifies the database
      under analysis, and no value from your tables reaches its output.
    section: database
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/pgfathom/LICENSE
      - src: README.md
        dst: /usr/share/doc/pgfathom/README.md
      - src: completions/pgfathom.bash
        dst: /usr/share/bash-completion/completions/pgfathom
      - src: completions/pgfathom.zsh
        dst: /usr/share/zsh/site-functions/_pgfathom
      - src: completions/pgfathom.fish
        dst: /usr/share/fish/vendor_completions.d/pgfathom.fish

# distroless/static, e não scratch: a ferramenta abre TLS contra o servidor do
# usuário, e a configuração recomendada verifica o certificado. Sem CA raiz
# dentro da imagem isso falha com uma mensagem que parece defeito do servidor.
dockers_v2:
  - images:
      - ghcr.io/lvcas-dotcom/pgfathom
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: https://github.com/lvcas-dotcom/pgfathom
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.description: >-
        Discovers and validates PostgreSQL relationships that exist in the data
        but were never declared

# Canal opcional, e só macOS: Homebrew no Linux não instala cask, então quem usa
# brew em Linux fica com o binário do release, `go install` ou a imagem.
#
# A escrita no tap vai por deploy key, não por token de usuário: a chave vale
# para um repositório e nada mais, não autentica como ninguém e não vence. O
# workflow grava a chave num arquivo e passa o caminho; sem ela, `skip_upload`
# fica verdadeiro e o release sai completo com um canal a menos, em vez de
# falhar no último passo depois de já ter publicado binário.
homebrew_casks:
  - name: pgfathom
    skip_upload: '{{ if .Env.HOMEBREW_TAP_KEY_PATH }}false{{ else }}true{{ end }}'
    repository:
      owner: lvcas-dotcom
      name: homebrew-tap
      git:
        url: git@github.com:lvcas-dotcom/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_KEY_PATH }}"
    homepage: https://github.com/lvcas-dotcom/pgfathom
    description: Discovers and validates PostgreSQL relationships that exist in the data but were never declared
    # Os binários não são assinados, e o macOS recusa binário baixado em
    # quarentena com uma mensagem sobre desenvolvedor não verificado. Sem este
    # hook o cask instala e não roda. Removê-lo contorna uma verificação do
    # sistema, e é por isso que o cask diz isso em voz alta, aqui e no caveat: a
    # solução de raiz é assinar e notarizar, que exige conta de desenvolvedor
    # Apple e ainda não existe.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pgfathom"]
          end
    # Uma linha só, e não é preferência de estilo: o goreleaser envolve cada
    # linha deste campo em aspas dentro de um `caveats do ... end`, e um bloco
    # Ruby devolve apenas a última expressão. Quebrado em quatro linhas, o
    # usuário lê a última frase e nada do aviso — que é justamente a parte que
    # não pode desaparecer.
    caveats: "The binaries are not signed or notarised, so this cask clears the macOS quarantine attribute on install. That bypasses a Gatekeeper check, and you should know that it does. Verify what you got against the checksums published with the release."

release:
  prerelease: auto
  footer: |
    ## Verificação

    Os artefatos não são assinados. O que existe é `checksums.txt`, publicado
    junto: confira o binário baixado contra ele antes de executar.

    Recall medido no corpus público em `docs/benchmark/recall.md`, com o que
    cada número mede e o que ele não mede.
