version: 2

# CGO_ENABLED=0 is a requirement rather than a tuning choice, and it is what
# makes these four platforms cheap. `make crosscheck` proves the same thing on
# every change.

project_name: pgfathom

before:
  hooks:
    - go mod tidy
    # Completions are generated from the command, never written by hand:
    # discover has twenty-one flags, and a hand-maintained file would drift on
    # the first release that added one — with no way for the drift to be
    # noticed. `go run` because this hook runs before a binary exists.
    - sh -c 'mkdir -p completions && for sh in bash zsh fish; do go run ./cmd/pgfathom completion "$sh" > "completions/pgfathom.$sh"; done'

builds:
  - id: pgfathom
    main: ./cmd/pgfathom
    binary: pgfathom
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # The three names below have to match the ones the Makefile injects. That
    # is two configurations agreeing on three variables, which is the kind of
    # agreement that breaks when somebody renames one of them — hence the CI job
    # that builds through this path and asks the binary for its version.
    ldflags:
      - -s -w
      - -X github.com/lvcas-dotcom/pgfathom/internal/buildinfo.Version={{ .Version }}
      - -X github.com/lvcas-dotcom/pgfathom/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/lvcas-dotcom/pgfathom/internal/buildinfo.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: pgfathom
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - src: completions/*
        dst: completions

# Whoever authorises running this against production verifies what they
# downloaded.
checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# Release notes come from the CHANGELOG, written by hand, passed through
# --release-notes in the workflow. A list of commits says what was touched;
# whoever opens a release wants to know what changed for them. See
# scripts/release-notes.sh.
#
# This stage stays ENABLED even though nothing here generates the notes, and
# that is not an oversight. `--release-notes` is loaded by this pipe, so
# disabling it drops the flag on the floor: the notes never load, the body comes
# out as the footer alone, and the release still succeeds. v0.1.2 shipped that
# way. The filters below are what the flag would otherwise fall back to.
changelog:
  use: git
  filters:
    exclude:
      - "^Merge pull request"
      - "^chore: arquiva"
      - "^docs:"
      - "^test:"

# A distribution package is the shortest path for the target user: a DBA on a
# Linux server, with no Go and no Homebrew. The paths below are not our choice,
# and that is what makes them right — whoever installs a package expects to find
# things where the system keeps them. No apt or yum repository: see
# docs/RELEASING.md.
nfpms:
  - id: pgfathom
    package_name: pgfathom
    formats: [deb, rpm]
    maintainer: lvcas-dotcom <https://github.com/lvcas-dotcom>
    homepage: https://github.com/lvcas-dotcom/pgfathom
    license: Apache-2.0
    description: |-
      Discovers and validates PostgreSQL relationships that exist in the data
      but were never declared.
      Strictly read-only: it never issues a statement that modifies the database
      under analysis, and no value from your tables reaches its output.
    section: database
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/pgfathom/LICENSE
      - src: README.md
        dst: /usr/share/doc/pgfathom/README.md
      - src: completions/pgfathom.bash
        dst: /usr/share/bash-completion/completions/pgfathom
      - src: completions/pgfathom.zsh
        dst: /usr/share/zsh/site-functions/_pgfathom
      - src: completions/pgfathom.fish
        dst: /usr/share/fish/vendor_completions.d/pgfathom.fish

# distroless/static rather than scratch: the tool opens TLS against the user's
# server, and the recommended configuration verifies the certificate. With no
# root CA inside the image that fails with a message that reads like a fault in
# their server.
dockers_v2:
  - images:
      - ghcr.io/lvcas-dotcom/pgfathom
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: https://github.com/lvcas-dotcom/pgfathom
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.description: >-
        Discovers and validates PostgreSQL relationships that exist in the data
        but were never declared

# An optional channel, and macOS only: Homebrew on Linux does not install
# casks, so brew users on Linux take the release binary, `go install` or the
# image.
#
# Writing to the tap goes through a deploy key rather than a user token: the key
# is good for one repository and nothing else, authenticates as nobody, and does
# not expire. The workflow writes the key to a file and passes the path; without
# it, `skip_upload` becomes true and the release goes out complete with one
# channel missing, rather than failing at the last step after binaries are
# already published.
homebrew_casks:
  - name: pgfathom
    skip_upload: '{{ if .Env.HOMEBREW_TAP_KEY_PATH }}false{{ else }}true{{ end }}'
    repository:
      owner: lvcas-dotcom
      name: homebrew-tap
      git:
        url: git@github.com:lvcas-dotcom/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_KEY_PATH }}"
    homepage: https://github.com/lvcas-dotcom/pgfathom
    description: Discovers and validates PostgreSQL relationships that exist in the data but were never declared
    # The binaries are not signed, and macOS refuses a quarantined download
    # with a message about an unverified developer. Without this hook the cask
    # installs and does not run. Removing it bypasses a system check, which is
    # why the cask says so out loud, here and in the caveat: the real fix is
    # signing and notarising, which needs an Apple developer account and does
    # not exist yet.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pgfathom"]
          end
    # One line, and not as a style preference: goreleaser wraps each line of
    # this field in quotes inside a `caveats do ... end`, and a Ruby block
    # returns only its last expression. Broken across four lines, the user reads
    # the final sentence and none of the warning — which is precisely the part
    # that cannot disappear.
    caveats: "The binaries are not signed or notarised, so this cask clears the macOS quarantine attribute on install. That bypasses a Gatekeeper check, and you should know that it does. Verify what you got against the checksums published with the release."

release:
  prerelease: auto
  # Appended to every published release, so it is read by users rather than by
  # contributors.
  footer: |
    ## Verifying what you downloaded

    These artifacts are not signed. What exists is `checksums.txt`, published
    alongside them: check your download against it before running it.

    Recall measured against the public corpus is in `docs/benchmark/recall.md`,
    including what each number measures and what it does not.
